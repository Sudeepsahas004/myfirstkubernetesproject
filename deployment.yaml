
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopsportal
  template:
    metadata:
      labels:
        app: devopsportal
    spec:
      containers:
        - name: devopsportal
          image: sahasacr.azurecr.io/myfirstkubernetesprojectimg:latest
          ports:
            - containerPort: 8080
